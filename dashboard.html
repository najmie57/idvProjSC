<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | SportsHub Sports Complex</title>
  <meta name="description" content="Daily summary of bookings, revenue and court availability.">
  <meta name="author" content="SportsHub Student Project">
  <link rel="icon" href="images/bad1.png" type="image/png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dashboard | SportsHub Sports Complex">
  <meta property="og:description" content="View SportsHub booking activity, revenue and court availability.">
  <meta property="og:image" content="images/bad1.png">
  <!-- Bootstrap 5.3.3 and Bootstrap Icons 1.11.3 are pinned to exact versions -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</head>
<body data-page="dashboard">
  <div id="app-nav"></div>
  <main class="container py-4">
    <header class="mb-4"><h1 class="h3 fw-bold mb-1">Dashboard</h1><p class="text-body-secondary mb-0" id="welcome"></p></header>
    <!-- Summary cards (filled by pages.js) -->
    <section class="row g-3 mb-4" id="statCards" aria-label="Summary"></section>
    <!-- Charts (drawn by charts.js) -->
    <section class="row g-3 mb-4" aria-label="Charts">
      <div class="col-lg-5"><div class="card h-100"><div class="card-body">
        <h2 class="h6 fw-bold">Bookings by sport</h2><p class="small text-body-secondary">Share of all active bookings</p>
        <div class="chart-box"><canvas id="sportChart" role="img" aria-label="Doughnut chart of bookings per sport"></canvas></div></div></div></div>
      <div class="col-lg-7"><div class="card h-100"><div class="card-body">
        <h2 class="h6 fw-bold">Bookings in the last 7 days</h2><p class="small text-body-secondary">Per day, split by sport</p>
        <div class="chart-box"><canvas id="weeklyChart" role="img" aria-label="Stacked bar chart of daily bookings"></canvas></div></div></div></div>
    </section>
    <!-- Upcoming bookings -->
    <section class="card"><div class="card-body">
      <h2 class="h6 fw-bold mb-3">Upcoming bookings</h2>
      <div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Date</th><th>Time</th><th>Court</th><th>Customer</th><th>Status</th></tr></thead>
        <tbody id="upcomingRows" aria-live="polite"></tbody></table></div>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
