<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings | SportsHub Sports Complex</title>
  <meta name="description" content="All court bookings with search and filters.">
  <meta name="author" content="SportsHub Student Project">
  <!-- Bootstrap 5.3.3 and Bootstrap Icons 1.11.3 are pinned to exact versions -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</head>
<body data-page="bookings">
  <div id="app-nav"></div>
  <main class="container py-4">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div><h1 class="h3 fw-bold mb-1">Bookings</h1><p class="text-body-secondary mb-0"><span id="rowCount">0</span> bookings shown</p></div>
      <a class="btn btn-primary" href="booking-form.html"><i class="bi bi-plus-lg me-1"></i>New booking</a>
    </header>
    <div id="newAlert" class="alert alert-success d-none" role="status"></div>
    <section class="card"><div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-md-6"><input class="form-control" id="searchBox" type="search" placeholder="Search by ID, customer or court" aria-label="Search bookings"></div>
        <div class="col-6 col-md-3"><select class="form-select" id="sportFilter" aria-label="Filter by sport">
          <option value="">All sports</option><option>Badminton</option><option>Futsal</option><option>Pickle Ball</option></select></div>
        <div class="col-6 col-md-3"><select class="form-select" id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option><option>Confirmed</option><option>Pending</option><option>Completed</option><option>Cancelled</option></select></div>
      </div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Customer</th><th>Court</th><th>Date</th><th>Time</th><th>Duration</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody id="bookingRows"></tbody></table></div>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
