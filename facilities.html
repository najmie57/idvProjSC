<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facilities | SportsHub Sports Complex</title>
  <meta name="description" content="Browse badminton, futsal and pickle ball courts with prices and availability.">
  <meta name="author" content="SportsHub Student Project">
  <!-- Bootstrap 5.3.3 and Bootstrap Icons 1.11.3 are pinned to exact versions -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</head>
<body data-page="facilities">
  <div id="app-nav"></div>
  <main class="container py-4">
    <header class="mb-4"><h1 class="h3 fw-bold mb-1">Facilities</h1><p class="text-body-secondary mb-0">Pick a court and book your slot. Peak rates apply from 18:00.</p></header>
    <div class="btn-group mb-4 flex-wrap" role="group" aria-label="Filter by sport">
      <button type="button" class="btn btn-outline-primary active" data-sport="">All</button>
      <button type="button" class="btn btn-outline-primary" data-sport="Badminton">Badminton</button>
      <button type="button" class="btn btn-outline-primary" data-sport="Futsal">Futsal</button>
      <button type="button" class="btn btn-outline-primary" data-sport="Pickle Ball">Pickle Ball</button>
    </div>
    <section class="row g-3" id="facilityGrid" aria-label="Court list"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
