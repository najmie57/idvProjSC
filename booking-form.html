<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Booking | SportsHub Sports Complex</title>
  <meta name="description" content="Reserve a court by choosing sport, court, date and time slot.">
  <meta name="author" content="SportsHub Student Project">
  <!-- Bootstrap 5.3.3 and Bootstrap Icons 1.11.3 are pinned to exact versions -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</head>
<body data-page="newbooking">
  <div id="app-nav"></div>
  <main class="container py-4" style="max-width:720px">
    <header class="mb-4"><h1 class="h3 fw-bold mb-1">New booking</h1><p class="text-body-secondary mb-0">Choose how long you want to play (1 to 4 hours). Times that clash with another booking are greyed out.</p></header>
    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
    <section class="card"><div class="card-body p-4">
      <form id="bookForm" novalidate>
        <div class="row g-3">
          <div class="col-12"><label class="form-label" for="bfName">Booked by</label>
            <input class="form-control" id="bfName" required><div class="invalid-feedback">Enter a name for this booking.</div></div>
          <div class="col-md-6"><label class="form-label" for="bfSport">Sport</label>
            <select class="form-select" id="bfSport" required><option value="">Choose a sport</option></select>
            <div class="invalid-feedback">Choose a sport.</div></div>
          <div class="col-md-6"><label class="form-label" for="bfFacility">Court</label>
            <select class="form-select" id="bfFacility" required><option value="">Choose a sport first</option></select>
            <div class="invalid-feedback">Choose a court.</div></div>
          <div class="col-md-6"><label class="form-label" for="bfDate">Date</label>
            <input type="date" class="form-control" id="bfDate" required><div class="invalid-feedback">Choose today or a future date.</div></div>
          <div class="col-md-6"><label class="form-label" for="bfDuration">How long</label>
            <select class="form-select" id="bfDuration" required></select></div>
          <div class="col-12"><label class="form-label" for="bfSlot">Start time</label>
            <select class="form-select" id="bfSlot" required><option value="">Choose a court first</option></select>
            <div class="invalid-feedback">Choose an open start time.</div></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
          <div><div class="small text-body-secondary">Total</div><div class="fs-4 fw-bold" id="bfPrice">RM 0.00</div><div class="small text-body-secondary" id="bfNote"></div></div>
          <button class="btn btn-primary px-4" type="submit">Confirm booking</button>
        </div>
      </form>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
